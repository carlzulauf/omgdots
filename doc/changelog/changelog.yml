# Change log for the development-only /changelog page.
# Schema and conventions: doc/changelog/README.md
entries:
  - id: 1
    title: "Dev-only /changelog page and screenshot tooling"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [3]
    request: "Keep an up to date list of changes made with summaries and screenshots/recordings on a page visible in development mode for this app on the `/changelog` route."
    summary: |
      - `/changelog` lists the queue (in progress, queued, blocked), finished work with summaries, commits and media, and dropped requests
      - Data lives in `doc/changelog/changelog.yml`, media in `doc/changelog/media/`
      - Routes are only drawn in development, and the controller returns 404 outside development as a backstop
      - `bin/claude-shot` drives headless Chromium for screenshots, two-browser (two-player) flows and webm/gif recordings
      - `doc/changelog/README.md` documents the dev env, the tool and the YAML schema
    commits: [b035caa]
    media:
      - file: "001-changelog-desktop.png"
        caption: "The changelog page (1280px)"
      - file: "001-changelog-phone.png"
        caption: "At phone width (375px)"

  - id: 2
    title: "Nix flake dev environment"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: []
    request: "we're going to need to nix flake-ify this repo, similar to what's been done for other apps in ~/projects like exalog, underbee, overbee, portal, and more."
    summary: |
      origin/main already had a flake. It was aligned with the sibling projects:

      - Ruby bound once in the flake
      - Gems under `~/.local/share/gems/omgdots/ruby-X`
      - Bundler overlay kept, since nixpkgs ships 2.7.2
      - Broken `packages.default` removed
      - `.envrc` added, along with the `.gitignore` fix that had been hiding it
      - `Procfile.dev` plus `bin/dev` (foreman) on port 3017
      - README "Run Locally" rewritten
    commits: [9a7d651]
    media: []

  - id: 3
    title: "Upgrade to Rails 8.1, Ruby 4.0 and all gems"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [2]
    request: "I want the latest version of rails, and all other gems updated as far as they can."
    summary: |
      - Ruby 4.0.9, Rails 8.1.4.1 with `load_defaults 8.1`, bundler 4.0.24
      - propshaft + importmap + dartsass-rails replace sprockets, Ruby Sass, CoffeeScript and uglifier; the CoffeeScript was hand-converted to ES modules
      - redis gem 6 and rack 3
      - A cookie rotator keeps existing player sessions working across the deploy
      - Dockerfile on ruby:4.0; production precompile and a Docker smoke test pass
      - Remaining outdated gems are held back by dependencies: diff-lcs by rspec, marcel by activestorage, redis-client by redis
    commits: [18c652b, ab4d382, 4d420ea, 3ebed68, 6a142c4, d3c6bf3]
    media:
      - file: "003-before-game.png"
        caption: "Rails 7.2 (before)"
      - file: "003-after-game.png"
        caption: "Rails 8.1 (after)"

