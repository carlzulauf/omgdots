# Change log for the development-only /changelog page.
# Schema and conventions: doc/changelog/README.md
entries:
  - id: 1
    title: "Dev-only /changelog page and screenshot tooling"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [3]
    request: "Keep an up to date list of changes made with summaries and screenshots/recordings on a page visible in development mode for this app on the `/changelog` route."
    summary: |
      - `/changelog` lists the queue (in progress, queued, blocked), finished work with summaries, commits and media, and dropped requests
      - Data lives in `doc/changelog/changelog.yml`, media in `doc/changelog/media/`
      - Routes are only drawn in development, and the controller returns 404 outside development as a backstop
      - `bin/claude-shot` drives headless Chromium for screenshots, two-browser (two-player) flows and webm/gif recordings
      - `doc/changelog/README.md` documents the dev env, the tool and the YAML schema
    commits: [b035caa]
    media:
      - file: "001-changelog-desktop.png"
        caption: "The changelog page (1280px)"
      - file: "001-changelog-phone.png"
        caption: "At phone width (375px)"

  - id: 2
    title: "Nix flake dev environment"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: []
    request: "we're going to need to nix flake-ify this repo, similar to what's been done for other apps in ~/projects like exalog, underbee, overbee, portal, and more."
    summary: |
      origin/main already had a flake. It was aligned with the sibling projects:

      - Ruby bound once in the flake
      - Gems under `~/.local/share/gems/omgdots/ruby-X`
      - Bundler overlay kept, since nixpkgs ships 2.7.2
      - Broken `packages.default` removed
      - `.envrc` added, along with the `.gitignore` fix that had been hiding it
      - `Procfile.dev` plus `bin/dev` (foreman) on port 3017
      - README "Run Locally" rewritten
    commits: [9a7d651]
    media: []

  - id: 3
    title: "Upgrade to Rails 8.1, Ruby 4.0 and all gems"
    status: done
    priority: 1
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [2]
    request: "I want the latest version of rails, and all other gems updated as far as they can."
    summary: |
      - Ruby 4.0.9, Rails 8.1.4.1 with `load_defaults 8.1`, bundler 4.0.24
      - propshaft + importmap + dartsass-rails replace sprockets, Ruby Sass, CoffeeScript and uglifier; the CoffeeScript was hand-converted to ES modules
      - redis gem 6 and rack 3
      - A cookie rotator keeps existing player sessions working across the deploy
      - Dockerfile on ruby:4.0; production precompile and a Docker smoke test pass
      - Remaining outdated gems are held back by dependencies: diff-lcs by rspec, marcel by activestorage, redis-client by redis
    commits: [18c652b, ab4d382, 4d420ea, 3ebed68, 6a142c4, d3c6bf3]
    media:
      - file: "003-before-game.png"
        caption: "Rails 7.2 (before)"
      - file: "003-after-game.png"
        caption: "Rails 8.1 (after)"

  - id: 4
    title: "Game UI: player status bar with switcher + share link"
    status: done
    priority: 2
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [3, 1]
    request: "Then, I want the game UI improved a bit. The current player status and switcher is quite hidden. Above the scoreboard, indicate the current player or spectating, a switch to toggle between them, and a share link that just shows and copies the current URL."
    summary: "- A new bar above the scoreboard shows who this device is (\"You are Player 1 · <name>\", \"You are Player 2 · <name>\" or \"Spectating\") in the player's color with a small 7-segment seat display.\n- A three-way switch (Player 1 / Player 2 / Spectate) replaces the hidden hover menu and uses the existing `select_player` channel action.\n- The name field and Exit button moved into the bar; names save when you stop typing, on Enter or on blur.\n- Share row: a read-only field with the page URL and a Copy button (clipboard API with an `execCommand` fallback) that briefly shows \"Copied!\".\n- Works at 375px wide without horizontal overflow; the scoreboard got a small-screen rule since it already overflowed at that width."
    commits: [5493232]
    media:
      - file: "004-before.png"
        caption: "Before: seat choice hidden in a small hover menu; success message shown in red"
      - file: "004-after-player.png"
        caption: "After: seat bar above the scoreboard, seated as Player 1 with a custom name"
      - file: "004-after-spectating.png"
        caption: "After: spectating"
      - file: "004-after-mobile.png"
        caption: "After: Player 2 at 375×667, no horizontal overflow"
      - file: "004-switch-and-copy.webm"
        caption: "Switching from Spectating to Player 1, then copying the share link"

  - id: 5
    title: "Board edge padding on small/scrolling viewports"
    status: done
    priority: 2
    requested: "2026-11-13"
    completed: "2026-11-14"
    blocked_by: [3]
    request: "At smaller screen sizes where scrolling is necessary, ensure there is sufficient padding around the game board so none of the play area is too close to the edge of the viewport when panning/scrolling to an edge."
    summary: "- About 30px of padding between the outermost dots and every screen edge, including the bottom, when scrolled all the way.\n- Lines have an invisible 7px extra hit area on each side, so scaled-down lines are still easy to tap.\n- Added a viewport meta tag (with `minimum-scale=1`, which avoids a Chrome mobile layout bug with wide pages; pinch zoom-in still works). Boards scale to fit phone width down to half size, then scroll.\n- The new-game form and long player names fit on phones."
    commits: [1ea0eb1]
    media:
      - file: "005-before-phone-corner.png"
        caption: "Before: a 20×20 board at 375×667 with no viewport tag; the phone zooms out and the board box runs to the edges"
      - file: "005-after-phone-corners.png"
        caption: "After: the four corners of a 20×20 board at 375×667, each with about 30px of padding"
      - file: "005-after-pan.webm"
        caption: "Scrolling around a 20×20 board on a phone-sized screen"

