  - id: 10
    title: "Player-change notifications must not block clicking lines"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: [3]
    request: "In network and single device mode, player change notifications should no longer get in the way of clicking on lines."
    summary: "- Notifications are now toasts floating over the top of the board; the board does not move when one appears.\n- The toast layer has `pointer-events: none`, so clicks go through to the lines underneath (tested by clicking a line under a toast).\n- Toasts fade after 3.5s, and at most three show at once.\n- Messages are inserted as text, not HTML."
    commits: [5493232]
    media:
      - file: "010-toast-over-board.png"
        caption: "Toasts over the board; the line clicked through the lower toast is drawn"

