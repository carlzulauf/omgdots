  - id: 7
    title: "Notification level defaults to error (success messages shown as errors)"
    status: done
    priority: 3
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found by the Nix flake agent (#2)"
    summary: "- `Notification` now defaults to `info` and has four levels: success, info, warning, error.\n- Each call site sends the right level: taking a seat is success, spectating is info, a seat already taken is error, \"Not your turn\" is warning.\n- Each level has its own toast color and icon (green ✓, blue i, amber !, red ✕).\n- New channel spec checks the level each action sends."
    commits: [de4c140]
    media:
      - file: "007-success-toast.png"
        caption: "\"Successfully became Player 1\" as a green success toast instead of red error text"

  - id: 8
    title: "Large boards use the full viewport width on big screens"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: [3, 4]
    request: "bigger boards on bigger screens should use the full viewport width to draw the board"
    summary: "- The nested scroll box and fixed ~900px column are gone; the page itself scrolls. The board panel is at least as wide as the scoreboard and grows to the board's width.\n- Boards too wide for the window shrink to fit (never grow past full size): 20×20 shows at full size at 1920px, 25×25 shrinks slightly.\n- The seat bar and scoreboard stay at their 906px width, centered, and stay in view when scrolling sideways. Toasts stick to the top of the screen."
    commits: [1ea0eb1]
    media:
      - file: "008-before-wide.png"
        caption: "Before: a 20×20 board at 1920×1080, stuck in a 900px scroll box with dots clipped at the left edge"
      - file: "008-after-wide.png"
        caption: "After: the same board at 1920×1080, using the width, with the scoreboard centered above"

  - id: 9
    title: "Single-device (hot seat) game mode"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: [3, 4]
    request: "Add a single device mode when creating a game that assumes both players are on the same device and switches the active player after every move, so play happens continuously on one device without having to switch manually between moves."
    summary: "- The new-game form has a Mode select: Network game (default, unchanged) or Single device. Stored as `DotsGame#mode`; older games read as network.\n- In single-device games the creating device holds both seats and always plays whoever's turn it is, so completing a box keeps the turn. No seat switching and no toasts per move.\n- The seat bar shows \"Single device · Player N's turn\" in that player's colour; the name box renames whoever's turn it is; the end-of-game overlay names the winner.\n- Other devices opening the link spectate live, and can't take a seat, move, rename or restart.\n- Restart keeps the mode and both seats."
    commits: [ad56b74]
    media:
      - file: "009-new-game-form.png"
        caption: "New-game form with the Mode option set to Single device"
      - file: "009-single-device-turn.png"
        caption: "Seat bar showing Player 2's turn after Bob completed a box"
      - file: "009-single-device-play.webm"
        caption: "Several moves on one device; Bob completes a box and keeps the turn, no switching, no toasts"

  - id: 10
    title: "Player-change notifications must not block clicking lines"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: [3]
    request: "In network and single device mode, player change notifications should no longer get in the way of clicking on lines."
    summary: "- Notifications are now toasts floating over the top of the board; the board does not move when one appears.\n- The toast layer has `pointer-events: none`, so clicks go through to the lines underneath (tested by clicking a line under a toast).\n- Toasts fade after 3.5s, and at most three show at once.\n- Messages are inserted as text, not HTML."
    commits: [5493232]
    media:
      - file: "010-toast-over-board.png"
        caption: "Toasts over the board; the line clicked through the lower toast is drawn"

  - id: 11
    title: "Concurrent moves: Redis lock not atomic and for_update drops conflicting updates"
    status: done
    priority: 3
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found during the Rails upgrade (#3)"
    summary: "- `with_lock` WATCHes the key, reloads, applies the change and queues the SET on the MULTI transaction, so EXEC aborts if another client wrote the game in between.\n- Aborted updates retry from a fresh read up to 5 times, then show a \"too busy, try again\" error toast instead of being silently dropped.\n- Specs (with and without `Redis::Namespace`) prove two concurrent moves on separate connections both land."
    commits: [5ffad9c]
    media: []

  - id: 12
    title: "Cleanup leftovers"
    status: done
    priority: 4
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found during the Rails upgrade (#3)"
    summary: "- Removed Capistrano (Capfile, config/deploy*, lib/capistrano, bin/cap) and the old VM deploy docs (install log, nginx.conf, puma.service).\n- Dockerfile no longer apt-installs nodejs, libsqlite3-dev or rsync; the image builds, precompiles and serves `/up` and `/` without Node.\n- Removed unused assets (14seg fonts, light.svg), the dead `PlayGame#reset`, mailer layouts, comment-only initializers and the empty Sprockets vendor dir.\n- README Deployment section updated: the Dockerfile is the only deploy path; `RAILS_ENV` and `SECRET_KEY_BASE` must be set in the container environment."
    commits: [145466d]
    media: []

  - id: 13
    title: "Trying to take an occupied seat drops you from your current seat"
    status: done
    priority: 3
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found while building the seat bar (#4)"
    summary: "- `select_player` checks the requested seat first; your seat is only released when the new one is free or you choose Spectate.\n- A refused request keeps your seat and shows \"Player N is already owned by someone else\" as an error toast."
    commits: [cf531bc]
    media:
      - file: "013-refused-seat.png"
        caption: "Player 2 asks for seat 1 and is refused: they keep seat 2 and get an error toast (Player 1 on the left)"

  - id: 14
    title: "Any seat can be taken over a minute after it was claimed"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found while building the seat bar (#4)"
    summary: "- `last_seen_at` is refreshed on subscribe, on every action, and by a 20s server-side heartbeat (ActionCable `periodically`), with no client changes.\n- On disconnect the seat is marked away; it frees after 2 minutes unless the owner returns. A connected player never loses their seat.\n- Single-device games keep both seats together."
    commits: [cf531bc]
    media: []

  - id: 15
    title: "Replace the seat bar with four subtle buttons above the board"
    status: done
    priority: 2
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: [9, 5]
    request: "The top game menu design is clunky and draws away from the scoreboard, the focus. It should be 4 simple and subtle equal-width buttons arranged horizontally above the board: Share, Player 1, Player 2, Spectator (with an similar indicator/selected for the last 3). Clicking Share triggers a popover dialog with the copy button and URL."
    summary: "- The seat bar is replaced by four quiet, equal-width buttons between the scoreboard and the board: Share, Player 1, Player 2, Spectator. Seat buttons light a small lamp in the seat's colour when selected and use the existing `select_player` action.\n- Share opens a native popover with the URL, a Copy button (\"Copied!\" feedback) and a close button; Escape and outside clicks close it without drawing a line on the board.\n- Rename by clicking your own name on the scoreboard (dotted underline, pencil on hover); it saves after a pause, on Enter or on blur, and Escape cancels. In single-device games both names are editable.\n- Single-device games: the Player 1/2 lamp follows the turn and seat buttons are disabled; other devices see disabled seat buttons with an explanation.\n- Phones: labels shorten to P1 / P2 / Watch on one row, and player names no longer truncate. The Exit button (a plain link home) was removed; the game-over Exit link remains."
    commits: [96e492e, ecf57b1]
    media:
      - file: "015-before.png"
        caption: "Before: the seat bar above the scoreboard"
      - file: "015-after.png"
        caption: "After: four quiet buttons under the scoreboard, Player 1 selected"
      - file: "015-share-popover.png"
        caption: "Share popover after clicking Copy"
      - file: "015-mobile.png"
        caption: "375×667: short labels on one row, full player names"
      - file: "015-rename.png"
        caption: "Renaming Player 1 in place on the scoreboard"

  - id: 16
    title: "Toasts can be lost when one connection sends several actions at once"
    status: done
    priority: 4
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found while building single-device mode (#9)"
    summary: "- The pending toast is now returned per action instead of stored on the channel instance, so simultaneous actions on one connection each get their own toast (spec fails on the old code)."
    commits: [cf531bc]
    media: []

  - id: 17
    title: "Pre-deploy review fixes"
    status: done
    priority: 1
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Once all of the work is complete, review the work and address any issues you find."
    summary: "- Cable connections are identified by the uid in the encrypted session cookie; the client-sent `user` param is ignored, so nobody can act as another player (it was possible on `main` too).\n- Player names are stripped and capped at 24 characters on the server; blank names are refused.\n- Game ids with dots work (`getElementById`, and the route no longer treats `.2` as a format).\n- Only seated players can restart; unused `DELETE /games/:id`, `post :restart` and the `tests` debug page are gone.\n- Game records expire 30 days after their last save; specs use their own Redis namespace.\n- Dockerfile defaults to `RAILS_ENV=production`, `.dockerignore` added, `BASE_URL` defaults to https://omgdots.mrks.io."
    commits: [94d85dd, 35908d8, d26779c, 9253bdd, f5ff884, fe3e432, ca38bfd, b740a69, 04f4c9c]
    media: []

