  - id: 7
    title: "Notification level defaults to error (success messages shown as errors)"
    status: done
    priority: 3
    requested: "2026-11-14"
    completed: "2026-11-14"
    blocked_by: []
    request: "Found by the Nix flake agent (#2)"
    summary: "- `Notification` now defaults to `info` and has four levels: success, info, warning, error.\n- Each call site sends the right level: taking a seat is success, spectating is info, a seat already taken is error, \"Not your turn\" is warning.\n- Each level has its own toast color and icon (green ✓, blue i, amber !, red ✕).\n- New channel spec checks the level each action sends."
    commits: [de4c140]
    media:
      - file: "007-success-toast.png"
        caption: "\"Successfully became Player 1\" as a green success toast instead of red error text"

